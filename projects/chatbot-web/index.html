<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="chat-header">
            <div class="header-left">
                <div class="avatar-group">
                    <div class="bot-avatar">AI</div>
                    <div class="status-indicator"></div>
                </div>
                <div class="header-info">
                    <h1>SaaS Assistant</h1>
                    <p>Always online</p>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" title="Refresh conversation" id="refreshBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                </button>
            </div>
        </header>

        <main class="chat-window" id="chatWindow">
            <div class="message bot">
                <div class="message-bubble">Hello! How can I assist you today? (type 'exit' to end)</div>
            </div>
        </main>

        <footer class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Ask me something..." autocomplete="off">
                <button id="sendBtn" aria-label="Send message">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
            <div class="hint-text">Try commands: quiz, jokes, calculate</div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
