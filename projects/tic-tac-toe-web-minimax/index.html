<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tic Tac Toe AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>
<h1>Tic Tac Toe AI</h1>
<p class="subtitle">Play against an unbeatable Minimax AI.</p>
</header>

<!-- SCOREBOARD -->

<div class="game-info">

<div class="info-card">
<h3>Player</h3>
<div class="player-symbol">X</div>
</div>

<div class="info-card">
<h3>Score</h3>
<div class="score">
<span id="playerScore">0</span> - <span id="aiScore">0</span>
</div>
</div>

<div class="info-card">
<h3>AI</h3>
<div class="ai-symbol">O</div>
</div>

</div>

<!-- DIFFICULTY -->

<div class="difficulty-level">

<button class="difficulty-btn" data-level="easy">
Easy
</button>

<button class="difficulty-btn" data-level="medium">
Medium
</button>

<button class="difficulty-btn active" data-level="hard">
Hard
</button>

</div>

<!-- GAME STATUS -->

<div class="status" id="status">
Your turn. Click any square to start.
</div>

<!-- GAME BOARD -->

<div class="game-board" id="gameBoard">

<div class="cell" data-index="0"></div>
<div class="cell" data-index="1"></div>
<div class="cell" data-index="2"></div>

<div class="cell" data-index="3"></div>
<div class="cell" data-index="4"></div>
<div class="cell" data-index="5"></div>

<div class="cell" data-index="6"></div>
<div class="cell" data-index="7"></div>
<div class="cell" data-index="8"></div>

</div>

<!-- GAME CONTROLS -->

<div class="controls">

<button class="btn btn-primary" id="resetBtn">
New Game
</button>

<button class="btn btn-secondary" id="resetScoreBtn">
Reset Score
</button>

</div>

<footer>
<p>Minimax-based Tic Tac Toe — CodSoft Internship Project</p>
</footer>

</div>

<script src="script.js"></script>

</body>
</html>
